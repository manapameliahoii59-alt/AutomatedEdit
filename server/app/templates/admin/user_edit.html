{% extends "admin/base.html" %}
{% block title %}编辑用户 · {{ app_name }}{% endblock %}
{% block body %}
<div class="head">
  <div>
    <h1>编辑用户</h1>
    <p>{{ user.username }} · 保存后立即对桌面端生效</p>
  </div>
  <a class="el-button" href="/admin/users">返回列表</a>
</div>
{% if saved %}
<div class="flash">
  <div class="el-alert el-alert--success is-light" role="alert">
    <div class="el-alert__content"><span class="el-alert__title">已保存</span></div>
  </div>
</div>
{% endif %}
<form class="form-wrap" method="post" action="/admin/user/edit/{{ user.id }}">
  <section class="block">
    <h2>账号与权限</h2>
    <div class="form-grid">
      <div>
        <label class="lbl" for="username">账号</label>
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" id="username" name="username" value="{{ user.username }}">
          </div>
        </div>
      </div>
      <div>
        <label class="lbl" for="role">角色</label>
        <select class="admin-select" id="role" name="role">
          <option value="user" {% if user.role == "user" %}selected{% endif %}>user</option>
          <option value="admin" {% if user.role == "admin" %}selected{% endif %}>admin</option>
        </select>
      </div>
      <div>
        <label class="lbl">允许使用桌面端</label>
        <div class="form-check form-switch m-0{% if user.is_active %} is-on{% endif %}">
          <input class="form-check-input" type="checkbox" role="switch" name="is_active" value="y"{% if user.is_active %} checked{% endif %}>
        </div>
      </div>
      <div>
        <label class="lbl" for="valid_until">使用期限（空=永久）</label>
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" id="valid_until" name="valid_until" type="date" value="{{ user.valid_until.isoformat() if user.valid_until else '' }}">
          </div>
        </div>
      </div>
      <div>
        <label class="lbl" for="daily_plan_limit">每日策划上限（0=不限）</label>
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" id="daily_plan_limit" name="daily_plan_limit" value="{{ user.daily_plan_limit }}">
          </div>
        </div>
      </div>
      <div>
        <label class="lbl" for="daily_clip_limit">每日剪辑上限（0=不限）</label>
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" id="daily_clip_limit" name="daily_clip_limit" value="{{ user.daily_clip_limit }}">
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="block">
    <h2>策划通道</h2>
    <div class="form-grid">
      <div class="wide">
        <label class="lbl" for="plan_llm_preset">策划模型</label>
        <select class="admin-select" id="plan_llm_preset" name="plan_llm_preset">
          {% for value, label in plan_choices %}
          <option value="{{ value }}" {% if value == plan_llm_preset %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
        <p class="hint">官方填 DeepSeek Key；OpenCode Go 填 Zen/Go Key；小米 MiMo 填 MiMo API Key</p>
      </div>
      <div class="wide">
        <label class="lbl" for="deepseek_keys">策划 API Keys（逗号分隔）</label>
        <div class="el-textarea">
          <textarea class="el-textarea__inner" id="deepseek_keys" name="deepseek_keys">{{ deepseek_keys }}</textarea>
        </div>
      </div>
      <div class="wide">
        <label class="lbl" for="dashscope_key">DashScope Key（可选）</label>
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" id="dashscope_key" name="dashscope_key" value="{{ dashscope_key }}">
          </div>
        </div>
      </div>
    </div>
  </section>
  <div class="actions">
    <button class="el-button el-button--primary" type="submit" name="save" value="Save">保存</button>
    <a class="el-button" href="/admin/users">取消</a>
  </div>
</form>
{% endblock %}

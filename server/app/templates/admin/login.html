<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ app_name }}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fa;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
    }
    .card {
      width: min(420px, 92vw);
      background: #fff;
      border: 1px solid #ebeef5;
      border-radius: 8px;
      padding: 32px 28px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 22px; color: #909399; font-size: 13px; }
    .el-form-item { margin-bottom: 16px; }
    .el-input__wrapper {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 11px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
    }
    .el-input__inner {
      border: 0;
      outline: none;
      width: 100%;
      height: 30px;
      font-size: 14px;
    }
    .el-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 16px;
      border: 1px solid #409eff;
      border-radius: 4px;
      background: #409eff;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .err { color: #f56c6c; font-size: 13px; min-height: 1.2em; margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>剪辑助手</h1>
    <p>管理后台登录</p>
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="el-form-item">
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" name="username" placeholder="管理员账号" autocomplete="username" required>
          </div>
        </div>
      </div>
      <div class="el-form-item">
        <div class="el-input">
          <div class="el-input__wrapper">
            <input class="el-input__inner" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
          </div>
        </div>
      </div>
      <div class="err">{{ error }}</div>
      <button class="el-button el-button--primary" type="submit" style="width:100%">进入后台</button>
    </form>
  </div>
</body>
</html>

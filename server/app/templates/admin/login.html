<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ app_name }}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #f5f7fa;
      {{ bg_css | safe }}
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "MiSans", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      position: relative;
    }
    {% if bg_css and "f5f7fa" not in bg_css %}
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0, 0, 0, 0.06) 0%, rgba(0, 0, 0, 0.22) 100%);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 1;
      pointer-events: none;
    }
    {% endif %}
    .card {
      position: relative;
      z-index: 2;
      width: min(420px, 92vw);
      {% if is_glass and bg_css and "f5f7fa" not in bg_css %}
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.68) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0.58) 100%
      );
      backdrop-filter: blur(36px) saturate(210%) contrast(102%);
      -webkit-backdrop-filter: blur(36px) saturate(210%) contrast(102%);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        0 24px 50px -12px rgba(0, 0, 0, 0.16),
        0 1px 3px rgba(0, 0, 0, 0.05),
        inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px 0 rgba(255, 255, 255, 0.3);
      {% else %}
      background: #ffffff;
      border: 1px solid #ebeef5;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.03);
      {% endif %}
      border-radius: 16px;
      padding: 38px 34px 32px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-header {
      margin-bottom: 26px;
      text-align: center;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #409eff 0%, #2f85eb 100%);
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px -4px rgba(64, 158, 255, 0.42), inset 0 1px 1.5px rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      color: #1d2129;
      font-weight: 650;
      letter-spacing: -0.025em;
    }
    p {
      margin: 0;
      color: #86909c;
      font-size: 13px;
      letter-spacing: 0.01em;
    }
    .el-form-item { margin-bottom: 18px; }
    .el-input__wrapper {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 14px;
      {% if is_glass and bg_css and "f5f7fa" not in bg_css %}
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
      {% else %}
      background: #fdfefe;
      border: 1px solid #dcdfe6;
      {% endif %}
      border-radius: 8px;
      transition: all 0.22s ease;
    }
    .el-input__wrapper:hover {
      border-color: #c0c4cc;
      {% if is_glass and bg_css and "f5f7fa" not in bg_css %}
      background: rgba(255, 255, 255, 0.65);
      {% endif %}
    }
    .el-input__wrapper:focus-within {
      border-color: #409eff;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.22), inset 0 1px 2px rgba(0, 0, 0, 0.02);
    }
    .el-input__inner {
      border: 0;
      outline: none;
      width: 100%;
      height: 36px;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.01em;
      color: #1d2129;
      background: transparent;
    }
    .el-input__inner::placeholder {
      color: #909399;
      font-weight: 400;
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #4e5969;
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.01em;
    }
    .remember-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #409eff;
      margin: 0;
    }
    .el-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: linear-gradient(135deg, #409eff 0%, #2f85eb 100%);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 550;
      letter-spacing: 0.025em;
      box-shadow: 0 6px 18px -3px rgba(64, 158, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.22s ease;
      width: 100%;
    }
    .el-button:hover {
      background: linear-gradient(135deg, #53a8ff 0%, #3d8ff5 100%);
      box-shadow: 0 8px 22px -2px rgba(64, 158, 255, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }
    .el-button:active {
      transform: translateY(0);
      background: #2b7ad9;
      box-shadow: 0 3px 10px rgba(64, 158, 255, 0.3);
    }
    .err {
      color: #f56c6c;
      font-size: 13px;
      min-height: 1.2em;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  {% if is_preview %}
  <div style="position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(30, 35, 45, 0.88); color: #fff; padding: 7px 18px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);">
    <span style="font-weight: 500;">👁️ 登录界面封面预览模式</span>
    <a href="/admin/profile" style="color: #79bbff; text-decoration: underline; font-size: 12px;">返回个人中心</a>
    <button type="button" onclick="window.close()" style="background: rgba(255,255,255,0.15); border: none; color: #fff; cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 4px;" title="关闭预览窗口">关闭预览</button>
  </div>
  {% endif %}
  {% if bg_css and "f5f7fa" not in bg_css %}
  <div class="bg-overlay"></div>
  {% endif %}
  <div class="card">
    <div class="brand-header">
      <div class="brand-logo">✂</div>
      <h1>剪辑助手</h1>
      <p>管理后台登录</p>
    </div>
    <form id="loginForm" method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="el-form-item">
        <div class="el-input">
          <div class="el-input__wrapper">
            <input id="usernameInput" class="el-input__inner" name="username" placeholder="管理员账号" autocomplete="username" required>
          </div>
        </div>
      </div>
      <div class="el-form-item">
        <div class="el-input">
          <div class="el-input__wrapper">
            <input id="passwordInput" class="el-input__inner" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
          </div>
        </div>
      </div>
      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          <span>记住密码</span>
        </label>
      </div>
      {% if error %}
      <div class="err">⚠ {{ error }}</div>
      {% else %}
      <div class="err"></div>
      {% endif %}
      <button class="el-button el-button--primary" type="submit">进入后台</button>
    </form>
  </div>
  <script>
    (function () {
      try {
        sessionStorage.removeItem("missing_keys_dialog_dismissed");
      } catch (e) {}

      const STORAGE_KEY_USER = "admin_remember_user";
      const STORAGE_KEY_PWD = "admin_remember_pwd";
      const STORAGE_KEY_ENABLED = "admin_remember_enabled";

      const form = document.getElementById("loginForm");
      const userInput = document.getElementById("usernameInput");
      const pwdInput = document.getElementById("passwordInput");
      const rememberCheckbox = document.getElementById("rememberMe");

      try {
        const isRemembered = localStorage.getItem(STORAGE_KEY_ENABLED) === "true";
        if (isRemembered) {
          const savedUser = localStorage.getItem(STORAGE_KEY_USER) || "";
          const savedPwd = localStorage.getItem(STORAGE_KEY_PWD) || "";
          if (savedUser) userInput.value = savedUser;
          if (savedPwd) pwdInput.value = savedPwd;
          rememberCheckbox.checked = true;
        }
      } catch (err) {
        console.warn("Storage access error:", err);
      }

      if (form) {
        form.addEventListener("submit", function () {
          try {
            if (rememberCheckbox.checked) {
              localStorage.setItem(STORAGE_KEY_ENABLED, "true");
              localStorage.setItem(STORAGE_KEY_USER, userInput.value.trim());
              localStorage.setItem(STORAGE_KEY_PWD, pwdInput.value);
            } else {
              localStorage.removeItem(STORAGE_KEY_ENABLED);
              localStorage.removeItem(STORAGE_KEY_USER);
              localStorage.removeItem(STORAGE_KEY_PWD);
            }
          } catch (err) {
            console.warn("Storage write error:", err);
          }
        });
      }
    })();
  </script>
</body>
</html>

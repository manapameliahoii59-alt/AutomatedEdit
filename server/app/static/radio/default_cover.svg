<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c22" />
      <stop offset="50%" stop-color="#2d323f" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#409eff" />
      <stop offset="70%" stop-color="#2a77cc" />
      <stop offset="100%" stop-color="#144d8c" />
    </radialGradient>
  </defs>
  <!-- Outer Vinyl Disc -->
  <circle cx="100" cy="100" r="95" fill="url(#discGrad)" stroke="#3a3f4d" stroke-width="2" />
  <!-- Grooves -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#252933" stroke-width="1" stroke-dasharray="3,2" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="#252933" stroke-width="1" />
  <circle cx="100" cy="100" r="58" fill="none" stroke="#252933" stroke-width="1" stroke-dasharray="4,2" />
  <circle cx="100" cy="100" r="46" fill="none" stroke="#252933" stroke-width="1" />
  <!-- Center Label -->
  <circle cx="100" cy="100" r="36" fill="url(#centerGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Note Icon -->
  <path d="M93 84 v24 a7 7 0 1 1 -5 -2 v-20 h18 v16 a7 7 0 1 1 -5 -2 v-16 z" fill="#ffffff" />
  <!-- Center Spindle Hole -->
  <circle cx="100" cy="100" r="7" fill="#ffffff" />
  <circle cx="100" cy="100" r="4" fill="#0f1115" />
</svg>
